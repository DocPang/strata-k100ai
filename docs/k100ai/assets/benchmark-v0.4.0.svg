  <text x="594" y="246" class="bar-lbl">v0.4.0 极速</text>
  <rect x="698" y="234" width="177" height="18" rx="4" fill="url(#v040Amber)"/>
  <text x="883" y="247" class="val-new">1,629.7 (20.1s)</text>
  <rect x="1004" y="234" width="58" height="18" rx="9" fill="#d97706"/>
  <text x="1033" y="247" text-anchor="middle" class="badge-txt">3.18×</text>

  <line x1="594" y1="270" x2="1066" y2="270" stroke="#f1f5f9" stroke-width="1.5"/>

  <text x="594" y="294" class="group-lbl">4K Prefill 首字吞吐（tok/s，越高越好）</text>

  <text x="594" y="320" class="bar-lbl">v0.3.2 基线</text>
  <rect x="698" y="308" width="85" height="16" rx="4" fill="#cbd5e1"/>
  <text x="791" y="320" class="val-old">404.6</text>

  <text x="594" y="344" class="bar-lbl">v0.4.0 无损</text>
  <rect x="698" y="332" width="95" height="18" rx="4" fill="url(#v040Blue)"/>
  <text x="801" y="345" class="val-new">451.8</text>
  <rect x="1004" y="332" width="58" height="18" rx="9" fill="#0ea5e9"/>
  <text x="1033" y="345" text-anchor="middle" class="badge-txt">+11.7%</text>

  <text x="594" y="370" class="bar-lbl">v0.4.0 极速</text>
  <rect x="698" y="358" width="175" height="18" rx="4" fill="url(#v040Amber)"/>
  <text x="881" y="371" class="val-new">831.8 tok/s</text>
  <rect x="1004" y="358" width="58" height="18" rx="9" fill="#d97706"/>
  <text x="1033" y="371" text-anchor="middle" class="badge-txt">2.06×</text>

  <line x1="594" y1="392" x2="1066" y2="392" stroke="#f1f5f9" stroke-width="1.5"/>

  <text x="594" y="414" class="group-lbl">32K Decode 生成速度（tok/s，越高越好）</text>

  <text x="594" y="438" class="bar-lbl">v0.3.2 基线</text>
  <rect x="698" y="426" width="161" height="16" rx="4" fill="#cbd5e1"/>
  <text x="867" y="438" class="val-old">43.99</text>

  <text x="594" y="462" class="bar-lbl">v0.4.0 无损</text>
  <rect x="698" y="450" width="188" height="18" rx="4" fill="url(#v040Teal)"/>
  <text x="894" y="463" class="val-new">51.23 tok/s</text>
  <rect x="1004" y="450" width="58" height="18" rx="9" fill="#16a34a"/>
  <text x="1033" y="463" text-anchor="middle" class="badge-txt">+16.5%</text>

  <text x="36" y="534" class="foot">测试硬件：海光 K100AI（gfx928 · 64 GiB/卡），Linux x86_64 + DTK 运行时。所有权重保持原盘只读未改动；完整复现步骤与校验和见 docs/k100ai/INSTALL.md。</text>
  <text x="1084" y="534" text-anchor="end" class="foot">github.com/DocPang/strata-k100ai</text>
